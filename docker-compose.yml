services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promoeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-promoeye}
      LANG: pt_BR.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Só no loopback e na 5433, para não brigar com outro Postgres local na 5432.
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-promoeye} -d ${POSTGRES_DB:-promoeye}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    profiles: ['prod']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-promoeye}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-promoeye}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COLLECT_CRON: ${COLLECT_CRON:-5 * * * *}
      COLLECT_ENABLED: 'true'
      PEAK_FROM: ${PEAK_FROM:-}
      PEAK_UNTIL: ${PEAK_UNTIL:-}
      PEAK_EVERY_MIN: ${PEAK_EVERY_MIN:-20}
      QUIET_OFF_FROM: ${QUIET_OFF_FROM:-}
      QUIET_OFF_UNTIL: ${QUIET_OFF_UNTIL:-}
      TRUST_PROXY: 'true'
      TZ: America/Sao_Paulo
      WAHA_URL: ${WAHA_API_KEY:+http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    ports:
      # Só para testar a imagem de produção no seu computador. A VPS usa ops/vps/compose.yml.
      - '127.0.0.1:${APP_PORT:-3010}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # WhatsApp (envio automático). Só sobe quando pedido: `docker compose up -d waha`.
  # No .env: WAHA_URL=http://localhost:3100 e a mesma WAHA_API_KEY daqui.
  waha:
    image: devlikeapro/waha:gows-2026.10.1
    restart: unless-stopped
    profiles: ['whatsapp']
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # Opcional aqui (e não ":?") para não travar o `docker compose up -d db` de quem não usa WhatsApp.
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'
      WAHA_RESTART_ALL_SESSIONS: 'True'
      TZ: America/Sao_Paulo
    volumes:
      - waha-sessions:/app/.sessions
    ports:
      - '127.0.0.1:3100:3000'

volumes:
  db-data:
  waha-sessions:
