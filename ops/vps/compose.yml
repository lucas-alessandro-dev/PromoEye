# PromoEye na VPS compartilhada.
#
# Este arquivo é copiado para /srv/apps/promoeye/compose.yml a cada deploy
# (ops/vps/up.sh). Lá, o código fica em ./src e os segredos em ./.env.
#
# Nenhuma porta é publicada no host. O Caddy de /srv/proxy chega no app pela
# rede compartilhada "proxy", com o apelido promoeye-app. O Postgres só existe
# na rede interna deste projeto, sem saída para a internet.
name: promoeye

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promoeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-promoeye}
      LANG: pt_BR.utf8
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-promoeye} -d ${POSTGRES_DB:-promoeye}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./src
      dockerfile: ops/Dockerfile
    image: promoeye-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-promoeye}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-promoeye}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COLLECT_CRON: ${COLLECT_CRON:-5 * * * *}
      COLLECT_ENABLED: ${COLLECT_ENABLED:-true}
      COLLECT_STORE_DELAY_MS: ${COLLECT_STORE_DELAY_MS:-1500}
      COLLECT_TIMEOUT_MS: ${COLLECT_TIMEOUT_MS:-15000}
      # Um salto só: o Caddy.
      TRUST_PROXY: 'true'
      TZ: America/Sao_Paulo
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env (o up.sh cria)}
      WAHA_SESSION: default
    networks:
      internal: {}
      whatsapp: {}
      proxy:
        # Nome único na rede compartilhada: outros projetos também terão um "app".
        aliases: [promoeye-app]
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WhatsApp HTTP API (https://waha.devlike.pro): gratuito e open source desde a
  # 2026.6. Mantém o número conectado e recebe os envios do app. Motor GOWS:
  # sem navegador, pouca memória. Nada de porta publicada nem painel/Swagger
  # ligados: só o app fala com ele, pela rede "whatsapp".
  waha:
    image: devlikeapro/waha:gows-2026.10.1
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env (o up.sh cria)}
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      # Depois de reiniciar, religa a sessão sozinho (a doc usa os dois nomes).
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'
      WAHA_RESTART_ALL_SESSIONS: 'True'
      TZ: America/Sao_Paulo
    volumes:
      # O login do número fica aqui: sem o volume, cada reinício pediria QR code.
      - waha-sessions:/app/.sessions
    networks:
      whatsapp: {}
      whatsapp-out: {}
    mem_limit: 512m

networks:
  internal:
    internal: true
  # app ↔ WAHA, sem saída para a internet.
  whatsapp:
    internal: true
  # WAHA → servidores do WhatsApp e fotos das lojas.
  whatsapp-out: {}
  proxy:
    external: true

volumes:
  db-data:
  waha-sessions:
